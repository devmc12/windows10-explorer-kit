; Example only: the app creates its own Config.ini beside the executable
; auto detects the Windows UI language once and saves the resolved locale
[General]
Theme=System
Language=auto

; Set false to copy paths without surrounding double quotes
[Copy]
QuotePaths=true

; Fixed folders are a JSON array of absolute paths
[Folders]
Remember=false
Fixed=[]

; Supported algorithms: MD5, SHA-1, SHA-256, SHA-512
; Parallelism is the maximum number of file readers: 5, 10, 15, 20, 30, 50 or 100
[Hash]
Algorithm=SHA-256
Parallelism=5
; FolderDepth counts the selected folder as level 1; 0 includes all levels
FolderDepth=1
